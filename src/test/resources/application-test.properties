# Use embedded MongoDB for tests
spring.data.mongodb.port=0
spring.data.mongodb.database=recommendation-test
spring.mongodb.embedded.version=4.11.0
spring.data.mongodb.uri=

# Disable Kafka bindings during tests
spring.cloud.function.definition=
spring.cloud.stream.bindings.lessonCompletedListener-in-0.consumer.auto-startup=false
spring.cloud.stream.bindings.feedbackGeneratedListener-in-0.consumer.auto-startup=false
spring.cloud.stream.bindings.conversationCompletedListener-in-0.consumer.auto-startup=false
spring.cloud.stream.bindings.gamificationEventListener-in-0.consumer.auto-startup=false
