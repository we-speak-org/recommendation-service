# Application
spring.application.name=recommendation-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Server
server.port=${SERVER_PORT:8080}
server.compression.enabled=true
server.error.include-message=always
server.error.include-binding-errors=always

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/recommendation}
spring.data.mongodb.database=${MONGODB_DATABASE:recommendation}
spring.data.mongodb.auto-index-creation=true

# Spring Cloud Stream - Kafka
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.cloud.stream.kafka.binder.configuration.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

# Function bindings (declare all listeners separated by semicolon)
spring.cloud.function.definition=lessonCompletedListener;feedbackGeneratedListener;userProfileUpdatedListener

# lesson.completed listener
spring.cloud.stream.bindings.lessonCompletedListener-in-0.destination=lesson.events
spring.cloud.stream.bindings.lessonCompletedListener-in-0.group=${spring.application.name}
spring.cloud.stream.bindings.lessonCompletedListener-in-0.consumer.max-attempts=3
spring.cloud.stream.bindings.lessonCompletedListener-in-0.consumer.back-off-initial-interval=1000
spring.cloud.stream.bindings.lessonCompletedListener-in-0.consumer.back-off-multiplier=2.0
spring.cloud.stream.bindings.lessonCompletedListener-in-0.consumer.back-off-max-interval=10000
spring.cloud.stream.kafka.bindings.lessonCompletedListener-in-0.consumer.enable-dlq=true
spring.cloud.stream.kafka.bindings.lessonCompletedListener-in-0.consumer.dlq-name=lesson.events.dlq

# feedback.generated listener
spring.cloud.stream.bindings.feedbackGeneratedListener-in-0.destination=feedback.events
spring.cloud.stream.bindings.feedbackGeneratedListener-in-0.group=${spring.application.name}
spring.cloud.stream.bindings.feedbackGeneratedListener-in-0.consumer.max-attempts=3
spring.cloud.stream.bindings.feedbackGeneratedListener-in-0.consumer.back-off-initial-interval=1000
spring.cloud.stream.bindings.feedbackGeneratedListener-in-0.consumer.back-off-multiplier=2.0
spring.cloud.stream.bindings.feedbackGeneratedListener-in-0.consumer.back-off-max-interval=10000
spring.cloud.stream.kafka.bindings.feedbackGeneratedListener-in-0.consumer.enable-dlq=true
spring.cloud.stream.kafka.bindings.feedbackGeneratedListener-in-0.consumer.dlq-name=feedback.events.dlq

# user.profile.updated listener
spring.cloud.stream.bindings.userProfileUpdatedListener-in-0.destination=user.events
spring.cloud.stream.bindings.userProfileUpdatedListener-in-0.group=${spring.application.name}
spring.cloud.stream.bindings.userProfileUpdatedListener-in-0.consumer.max-attempts=3
spring.cloud.stream.bindings.userProfileUpdatedListener-in-0.consumer.back-off-initial-interval=1000
spring.cloud.stream.bindings.userProfileUpdatedListener-in-0.consumer.back-off-multiplier=2.0
spring.cloud.stream.bindings.userProfileUpdatedListener-in-0.consumer.back-off-max-interval=10000
spring.cloud.stream.kafka.bindings.userProfileUpdatedListener-in-0.consumer.enable-dlq=true
spring.cloud.stream.kafka.bindings.userProfileUpdatedListener-in-0.consumer.dlq-name=user.events.dlq

# producer
spring.cloud.stream.bindings.recommendationProducer-out-0.destination=recommendation.events

# Security - OAuth2 Resource Server (Keycloak)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/wespeak}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/wespeak/protocol/openid-connect/certs}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.mongo.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false

# Logging
logging.level.root=${LOG_LEVEL:INFO}
logging.level.org.wespeak=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=${LOG_LEVEL:INFO}
logging.level.org.springframework.data.mongodb=${LOG_LEVEL:INFO}
logging.level.org.springframework.cloud.stream=${LOG_LEVEL:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Application Custom Configuration
app.name=${spring.application.name}
app.version=@project.version@
app.description=WeSpeak Recommendation Service
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000}
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
